name: AjoCircle USDC Testnet CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  usdc-contract:
    name: Segment 3 USDC contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path central-contract-usdc-segment3/Cargo.toml -- --check
      - name: Run contract tests
        run: cargo test --locked --manifest-path central-contract-usdc-segment3/Cargo.toml
      - name: Run Clippy
        run: cargo clippy --locked --manifest-path central-contract-usdc-segment3/Cargo.toml --all-targets -- -D warnings
      - name: Build Testnet WASM
        env:
          RUSTFLAGS: -C link-arg=--allow-undefined
        run: cargo build --locked --manifest-path central-contract-usdc-segment3/Cargo.toml --target wasm32-unknown-unknown --release --lib

  settlement-adapter:
    name: Settlement adapter tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          package-manager-cache: false
      - name: Run adapter tests
        run: node --test settlement-adapter/*.test.mjs

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        working-directory: web
        run: npm ci
      - name: Build frontend
        working-directory: web
        run: npm run build
